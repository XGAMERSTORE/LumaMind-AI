name: Build Nexa Social APK

on:
  push:
    branches: [nexa-social-build]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore Android project
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/nexa.tgz
          tar -xzf /tmp/nexa.tgz
      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK exists
        run: test -f android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NexaSocial-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to build branch
        shell: bash
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk NexaSocial-debug.apk
          git config user.name "Nexa Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add NexaSocial-debug.apk
          git commit -m "Build Nexa Social APK" || exit 0
          git push
